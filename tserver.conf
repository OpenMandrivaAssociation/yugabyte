# Arguments passed to yb-tserver. See:
#   /usr/lib/yugabyte/bin/yb-tserver --help
# and https://docs.yugabyte.com/stable/reference/configuration/yb-tserver/
#
# --pgsql_proxy_bind_address is the PostgreSQL-compatible YSQL port (default 5433).
# --cql_proxy_bind_address is the Cassandra-compatible YCQL port (default 9042).

YB_TSERVER_ARGS="--tserver_master_addrs=127.0.0.1:7100 --fs_data_dirs=/var/lib/yugabyte/tserver --rpc_bind_addresses=0.0.0.0:9100 --webserver_interface=0.0.0.0 --webserver_port=9000 --pgsql_proxy_bind_address=0.0.0.0:5433 --cql_proxy_bind_address=0.0.0.0:9042 --default_memory_limit_to_ram_ratio=0.60"
