# Arguments passed to yb-master. See:
#   /usr/lib/yugabyte/bin/yb-master --help
# and https://docs.yugabyte.com/stable/reference/configuration/yb-master/
#
# This default is a single-node development cluster. For a real cluster,
# list every master address and give each node a unique --fs_data_dirs /
# --master_addresses pair.

YB_MASTER_ARGS="--master_addresses=127.0.0.1:7100 --fs_data_dirs=/var/lib/yugabyte/master --rpc_bind_addresses=0.0.0.0:7100 --webserver_interface=0.0.0.0 --webserver_port=7000 --default_memory_limit_to_ram_ratio=0.30"
